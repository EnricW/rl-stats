<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Partidas — RL Stats</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="site"></nav>

    <header class="page-head">
      <div>
        <span class="kicker">Temporada · 3v3</span>
        <h1>Partidas</h1>
      </div>
      <span class="spacer"></span>
      <span class="sub" id="season-line"></span>
    </header>

    <section class="section" aria-label="Historial de partidas">
      <div class="card table-scroll">
        <table style="min-width:720px">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Mapa</th>
              <th class="num">Marcador</th>
              <th>Resultado</th>
              <th>Mejor del equipo</th>
              <th class="num">Ver</th>
            </tr>
          </thead>
          <tbody id="match-rows"></tbody>
        </table>
      </div>
    </section>

    <footer class="site">
      <span>Stats: ballchasing.com</span>
      <span>Informes: Claude</span>
      <span>Actualización automática con GitHub Actions</span>
    </footer>
  </div>

  <script type="module" src="pages/matches.js"></script>
</body>
</html>
