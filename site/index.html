<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>RL Stats — Panel del equipo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="site"></nav>

    <header class="page-head">
      <div>
        <span class="kicker">Temporada · 3v3</span>
        <h1>Panel del equipo</h1>
      </div>
      <span class="spacer"></span>
      <span class="sub">Stats de ballchasing · informes de coach IA tras cada partida</span>
    </header>

    <section class="tiles" id="tiles" aria-label="Resumen del equipo"></section>

    <section class="card form-strip" id="forma" aria-label="Forma del equipo"></section>

    <section class="feature" id="ultima" aria-label="Última partida"></section>

    <section class="section" id="ranking" aria-label="Ranking de jugadores">
      <h2>Ranking · score medio por partida</h2>
      <div class="card bars" id="ranking-bars"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Informe semanal del equipo</h2>
        <span class="chip violet">CLAUDE</span>
        <select id="team-report-date" class="metric-select" aria-label="Fecha del informe" hidden></select>
      </div>
      <div class="card report" id="team-report"></div>
    </section>

    <footer class="site">
      <span>Stats: ballchasing.com</span>
      <span>Informes: Claude</span>
      <span>Actualización automática con GitHub Actions</span>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js" integrity="sha384-NNQgBjjuhtXzPmmy4gurS5X7P4uTt1DThyevz4Ua0IVK5+kazYQI1W27JHjbbxQz" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.7/purify.min.js" integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ" crossorigin="anonymous"></script>
  <script type="module" src="pages/index.js"></script>
</body>
</html>
