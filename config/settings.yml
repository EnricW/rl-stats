# Configuración del pipeline. Las claves/tokens NUNCA van aquí:
# van en el .env de la raíz (plantilla: .env.example; git lo ignora).

# Zona horaria del equipo: solo se usa para etiquetar las sesiones con la
# fecha que percibe el usuario ("14 oct"), no para agrupar partidas.
timezone: "Europe/Madrid"

ballchasing:
  # ID del grupo del equipo en ballchasing.com (lo que va después de /group/ en su URL).
  group: "rl-stats-xl1gi5rbh9"
  # Visibilidad con la que el watcher y la vía manual suben los replays.
  visibility: unlisted
  # Descargar el .replay a replays/archive/ para que frames/events lo parseen.
  # La carpeta está en .gitignore: el almacén de replays es ballchasing y el
  # pipeline re-descarga lo que le falte.
  archive_replays: true

reports:
  # Informe por partida: lo más leído de la web (uno en cada página de
  # partida). Sonnet sintetiza entre métricas donde Haiku recitaba.
  # Coste medido 2026-10: ~$0,065/informe (~$2,6/mes a 40 partidas).
  match_model: claude-sonnet-5-5
  # Tendencias (jugador) e informe de equipo: el mejor análisis disponible.
  # Coste medido 2026-10: ~$0,17/informe de equipo y ~$0,09/jugador (~$2/mes).
  trend_model: claude-opus-5-5
  # Esfuerzo de razonamiento para las tendencias: Opus 5.5 trae "medium" por
  # defecto y el análisis semanal merece "high".
  trend_effort: high
  # Informes de tendencia: uno por SESIÓN de juego (una noche de partidas).
  # Una sesión son partidas consecutivas con menos de N horas de hueco, aunque
  # la tanda cruce la medianoche; su informe se genera cuando la sesión se cierra
  # (así los avisos del watcher durante la noche no regeneran nada).
  #
  # 3 h: el equipo juega de 21:00 a 23:45 como muy tarde, así que la sesión
  # queda cerrada hacia las 02:45 y el cron de las 03:23 ya puede informarla.
  # Margen de sobra sobre la pausa más larga vista dentro de una noche (1 h 39),
  # así que no parte sesiones. Bajarlo más apuraría ese margen.
  session_gap_hours: 3
  # Sesiones con menos partidas que esto no gastan un informe (sus partidas
  # entran igualmente como contexto del siguiente).
  session_min_games: 3
  # Tope de informes de tendencia por pasada: si algún día se importa una
  # temporada entera de replays, no se convierte en una factura ni agota el
  # timeout del job.
  max_player_reports_per_run: 6
  # Informe de equipo cada N días. Se decide por la fecha del último informe
  # (no por el evento cron): si una pasada se pierde, la siguiente lo genera.
  team_report_every_days: 7
  # Límite de salida por informe. El thinking adaptativo también lo consume:
  # con Opus 5.5 a effort high, 16000 cortaba el informe de equipo
  # ("Respuesta incompleta (max_tokens)"). Las peticiones van por streaming,
  # así que un límite alto no arriesga timeouts.
  max_tokens: 32000
  # Partidas de histórico por jugador incluidas en los prompts de tendencia y
  # equipo: las medias ya resumen la temporada entera, y sin recorte el coste
  # en tokens crecía sin límite con cada partida jugada.
  prompt_history_games: 20
  # Modelos (por prefijo) con fallback de servidor ante un refusal del clasificador.
  server_fallback_prefixes:
    - claude-sonnet-5-5
    - claude-opus-5-5
