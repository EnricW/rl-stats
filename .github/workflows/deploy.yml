# Despliegue de la web cuando se edita site/ o data/ a mano (el pipeline de
# ingest ya despliega por su cuenta tras cada tanda de datos, y sus pushes no
# disparan este workflow: GitHub no encadena workflows desde GITHUB_TOKEN).
# Sin data/** aquí, un push humano con solo datos (p. ej. informes
# regenerados) dejaba la web desactualizada hasta el siguiente deploy.

name: Desplegar web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false — GitHub desaconseja cancelar despliegues de Pages
# a medias; los pendientes en cola sí se sustituyen por el más nuevo.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages gratis requiere repo público; mientras sea privado se salta.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main — si este deploy quedó en cola detrás de uno de ingest (que
      # commitea datos nuevos), desplegar el SHA que lo disparó publicaría
      # datos viejos encima de los recién publicados.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Construir la web
        run: bash scripts/build_site.sh

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
