# Despliegue de la web cuando se edita site/ a mano (el pipeline de ingest ya
# despliega por su cuenta tras cada tanda de datos).

name: Desplegar web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false — GitHub desaconseja cancelar despliegues de Pages
# a medias; los pendientes en cola sí se sustituyen por el más nuevo.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages gratis requiere repo público; mientras sea privado se salta.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir la web
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          # cache-busting: versiona CSS/JS propios con el commit para que el
          # navegador no sirva assets viejos tras un deploy
          sed -i "s/styles\.css/styles.css?v=${GITHUB_SHA::8}/g; s/app\.js/app.js?v=${GITHUB_SHA::8}/g; s/viewer\.js/viewer.js?v=${GITHUB_SHA::8}/g" _site/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
