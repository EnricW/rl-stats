# Pipeline principal: sincroniza con ballchasing, agrega, genera informes IA,
# commitea los datos y despliega la web en GitHub Pages.
#
# Se dispara: al avisar el watcher (repository_dispatch), de madrugada por
# cron (publica la noche entera, informes incluidos, y reconcilia por si algún
# aviso se perdió), y a mano desde la pestaña Actions -> "Run workflow", que es
# la vía para publicar al momento tras subir replays a ballchasing.
#
# Los informes los decide report.py por estado, no el evento que disparó el
# job: los de tendencia cuando una sesión de juego se cierra, y el de equipo
# cuando pasan N días desde el último. Así una pasada perdida en la cola de
# concurrencia no deja nada sin generar.

name: Procesar partidas

on:
  repository_dispatch:
    types: [new-replay]
  schedule:
    # 03:23 en Madrid (02:23 en horario de invierno): una sola pasada que
    # publica la noche completa, informes de tendencia incluidos. El equipo
    # juega hasta las 23:45 como muy tarde y session_gap_hours es 3, así que a
    # esa hora la sesión ya está cerrada.
    #
    # La hora va en UTC (GitHub no ajusta el horario de verano) y el minuto es
    # "impopular" a propósito: a las horas en punto la cola de Actions se
    # congestiona y las ejecuciones se retrasan (una programada a las 07:00
    # salió a las 11:19).
    - cron: "23 1 * * *"
  workflow_dispatch:

# Permisos por job: process solo necesita escribir contenido; los de Pages
# (pages, id-token) los recibe únicamente el job deploy.
permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # El pipeline lee sus claves del .env de la raíz (git lo ignora;
      # el runner es efímero y se destruye al acabar el job). Los secrets se
      # pasan por env: interpolarlos con ${{ }} dentro del script rompería
      # con comillas en el valor y es el patrón que GitHub desaconseja.
      - name: Escribir .env desde los secrets
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf 'BALLCHASING_TOKEN=%s\nANTHROPIC_API_KEY=%s\n' \
            "$BALLCHASING_TOKEN" "$ANTHROPIC_API_KEY" > .env

      - name: Sincronizar con ballchasing
        run: python -m pipeline.sync

      - name: Derivados del replay (trayectorias del visor + eventos)
        run: python -m pipeline.derive

      - name: Agregar estadísticas
        run: python -m pipeline.aggregate

      - name: Informes IA
        run: python -m pipeline.report

      # segunda pasada: summary.json debe reflejar los informes recién creados
      - name: Refrescar índice
        run: python -m pipeline.aggregate

      # Se ejecuta aunque un paso anterior haya fallado: los informes IA ya
      # generados (y cobrados) no deben perderse con el runner efímero.
      - name: Commit de los datos
        if: ${{ !cancelled() }}
        run: |
          git config user.name "rl-stats bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: actualización automática"
            # por si alguien ha pusheado a main mientras corría el pipeline
            git pull --rebase origin main
            git push
          fi

      - name: Construir la web
        run: bash scripts/build_site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    # GitHub Pages gratis requiere repo público; mientras sea privado se salta.
    if: ${{ !github.event.repository.private }}
    needs: process
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # mismo grupo que deploy.yml: dos despliegues a Pages no se pisan
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
