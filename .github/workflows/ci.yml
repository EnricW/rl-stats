# Lint + tests del pipeline en cada push a main y en PRs.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "watcher/**"
      - "tests/**"
      - "site/**"
      - "config/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest

      # el runner trae Node: una sintaxis rota en un módulo dejaría la web
      # en blanco sin que nada lo avisara antes del deploy
      - name: Sintaxis del JS del sitio
        run: find site -name "*.js" -exec node --check {} +

      - name: Build de la web (humo)
        run: bash scripts/build_site.sh

      - name: Configuración YAML válida
        run: python -c "import yaml, pathlib; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in pathlib.Path('config').glob('*.yml')]"
