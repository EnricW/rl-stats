# Vía manual de respaldo: al subir un .replay a replays/inbox/ (arrastrándolo
# desde github.com), se envía a ballchasing y se encadena el pipeline normal.

name: Subida manual de replays

on:
  push:
    branches: [main]
    paths:
      - "replays/inbox/**"

permissions:
  contents: write

# Grupo propio: si compartiera el grupo "ingest", una subida manual en cola
# podría quedar sustituida por un cron y el inbox no se subiría.
concurrency:
  group: manual-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir .env desde los secrets
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
        run: printf 'BALLCHASING_TOKEN=%s\n' "$BALLCHASING_TOKEN" > .env

      - name: Subir inbox a ballchasing
        run: python -m pipeline.upload_inbox

      - name: Vaciar inbox
        run: |
          git config user.name "rl-stats bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add replays/inbox
          if ! git diff --cached --quiet; then
            git commit -m "replays: inbox subido a ballchasing"
            git push
          fi

      - name: Esperar a que ballchasing procese
        run: sleep 90

      - name: Disparar el pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/dispatches" -f event_type=new-replay
